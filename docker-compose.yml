version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seti
      POSTGRES_PASSWORD: seti
      POSTGRES_DB: seti
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seti -d seti"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://seti:seti@postgres:5432/seti
      REDIS_URL: redis://redis:6379
      PRETIUM_API_URL: ${PRETIUM_API_URL:-https://api.pretium.io}
      PRETIUM_API_KEY: ${PRETIUM_API_KEY:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-seti-dev-token}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      SETTLEMENT_CHAIN: ${SETTLEMENT_CHAIN:-celo}
      SETTLEMENT_ASSET: ${SETTLEMENT_ASSET:-USDC}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
